<div class="toolbar">
  <div class="search">
    <input
      type="text"
      class="input-search"
      placeholder="Search by book or member"
      [(ngModel)]="searchTerm"
      (input)="applyFilter()"
    />
    <button *ngIf="searchTerm" class="clear-btn" (click)="clearSearch()">✕</button>
  </div>

  <div class="tabs">
    <label>
      Show
      <select class="select-size" [(ngModel)]="pageSize" (change)="onPageSizeChange()">
        <option *ngFor="let s of pageSizes" [value]="s">{{ s }}</option>
      </select>
      entries
    </label>

    <!-- PENDING TAB -->
    <!-- <button
      class="tab-btn"
      [class.active]="activeTab === 'pending'"
      (click)="setTab('pending')"
    >
      Pending
    </button> -->

    <!-- HISTORY TAB -->
    <button
      class="tab-btn"
      [class.active]="activeTab === 'history'"
      (click)="setTab('history')"
    >
      History
    </button>
  </div>
</div>

<!-- Sub-filter tabs (only visible in Pending tab) -->
<div class="sub-tabs" *ngIf="activeTab === 'pending'">
  <button
    class="sub-tab-btn"
    [class.active]="pendingFilter === 'all'"
    (click)="setPendingFilter('all')"
  >
    All Pending
    <span class="sub-tab-count">{{ returns.length }}</span>
  </button>

  <button
    class="sub-tab-btn urgent"
    [class.active]="pendingFilter === 'requested'"
    (click)="setPendingFilter('requested')"
  >
    Return Requested
    <span class="sub-tab-count requested">{{ returnRequestedCount }}</span>
  </button>

  <button
    class="sub-tab-btn"
    [class.active]="pendingFilter === 'overdue'"
    (click)="setPendingFilter('overdue')"
  >
    Overdue
    <span class="sub-tab-count overdue">{{ overdueCount }}</span>
  </button>
</div>

<table class="users-table" *ngIf="filteredReturns.length > 0; else noResults">
  <thead>
    <tr>
      <th>#</th>
      <th>Book Title</th>
      <th>Member Name</th>
      <th>Condition</th>
      <th>Late Days</th>
      <th>Late Fee</th>
      <th *ngIf="activeTab==='pending'">Action</th>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let r of filteredReturns; let i = index"
        [class.row-requested]="r.returnRequested">
      <td>{{ i + 1 }}</td>

      <td>{{ r.bookTitle }}
          <span class="badge-requested" *ngIf="r.returnRequested">⏎ Requested</span>
      </td>

      <td>
        {{ r.memberName }}
      
      </td>

      <td>
        <span class="status" [attr.data-status]="r.condition">{{ r.condition || 'Good' }}</span>
      </td>

      <td>
        <span [class.overdue-days]="r.daysOverdue && r.daysOverdue > 0">
          {{ r.daysOverdue || 0 }}
        </span>
      </td>

      <td>{{ r.calculatedLateFee || 0 }}</td>

      <td *ngIf="activeTab==='pending'">
        <button class="action-btn return-btn" title="Process Return" (click)="openReturnModal(r)">🔄</button>
      </td>
    </tr>
  </tbody>
</table>

<ng-template #noResults>
  <div class="no-results">No return entries found.</div>
</ng-template>

<div class="pager" *ngIf="totalPages > 1">
  <button (click)="prev()" [disabled]="currentPage === 1">« Prev</button>

  <button
    *ngFor="let p of pages"
    (click)="setPage(p)"
    [class.active]="p === currentPage"
  >{{ p }}</button>

  <button (click)="next()" [disabled]="currentPage === totalPages">Next »</button>
</div>

<!-- Modal -->
<div class="modal fade show" *ngIf="showModal && activeReturn as r" style="display:block; background: rgba(0,0,0,0.5);">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">

      <div class="modal-header gradient-header">
        <h5 class="modal-title">Process Return</h5>
        <button type="button" class="btn btn-close btn-close-white" (click)="closeModal()">✕</button>
      </div>

      <div class="modal-body">

        <!-- Member Notes (read-only) — shown only when present -->
        <div class="member-notes-box" *ngIf="r.memberNotes">
          <div class="member-notes-label">
            <span class="notes-icon">📋</span> Member's Notes
          </div>
          <div class="member-notes-text">{{ r.memberNotes }}</div>
        </div>

        <form [formGroup]="processForm" class="modal-form grid-form">
          <div class="form-group">
            <label class="form-label">Book Title</label>
            <input class="form-control" [value]="r.bookTitle" disabled />
          </div>

          <div class="form-group">
            <label class="form-label">Member Name</label>
            <input class="form-control" [value]="r.memberName" disabled />
          </div>

          <div class="form-group">
            <label class="form-label">Condition</label>
            <select class="form-select" formControlName="condition">
              <option value="Good">Good</option>
              <option value="Damaged">Damaged</option>
              <option value="Lost">Lost</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Late Fee Per Day</label>
            <input type="number" class="form-control" formControlName="lateFeePerDay" />
          </div>

          <div class="form-group">
            <label class="form-label">Damage Fee</label>
            <input type="number" class="form-control" formControlName="damageFee" />
          </div>

          <div class="form-group">
            <label class="form-label">Lost Book Fee</label>
            <input type="number" class="form-control" formControlName="lostBookFee" />
          </div>

          <div class="form-group full-width">
            <label class="form-label">Admin Notes</label>
            <input type="text" class="form-control" formControlName="notes" />
          </div>
        </form>
      </div>

      <div class="modal-footer">
        <button class="btn btn-danger" (click)="closeModal()">Cancel</button>
        <button class="btn btn-primary" (click)="processReturn()">Process Return</button>
      </div>
    </div>
  </div>
</div>
