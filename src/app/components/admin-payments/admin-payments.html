<div class="users-root">

  <!-- ---------------- Toolbar ---------------- -->
  <div class="toolbar">
    <!-- Search -->
    <div class="left">
      <div class="search">
        <input
          class="input-search"
          type="text"
          placeholder="Search by user or method"
          [(ngModel)]="searchTerm"
          (input)="applyFilter()"
        />
        <button *ngIf="searchTerm" class="clear-btn" (click)="clearSearch()">✕</button>
      </div>
    </div>

    <!-- Right Controls -->
    <div class="right">
      <label>
        Show
        <select class="select-size" [(ngModel)]="pageSize" (change)="applyFilter()">
          <option *ngFor="let s of pageSizes" [value]="s">{{ s }}</option>
        </select>
        entries
      </label>
    </div>
  </div>

  <!-- ---------------- Table ---------------- -->
  <table class="users-table" *ngIf="filteredPayments.length > 0; else noResults">
    <thead>
      <tr>
        <th>#</th>
        <th>User</th>
        <th>Amount (AED)</th>
        <th>Method</th>
        <th>Status</th>
        <th>Date</th>
        <th>Refund Issued</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let p of filteredPayments; let i = index">
        <td>{{ (currentPage - 1) * pageSize + i + 1 }}</td>
        <td>{{ p.user }}</td>
        <td>{{ p.amount }}</td>
        <td>{{ p.method }}</td>
        <td><span class="status" [attr.data-status]="p.status">{{ p.status }}</span></td>
        <td>{{ p.date }}</td>
        <td>
          <span [ngClass]="{ 'status': true }" [attr.data-status]="p.refundIssued ? 'Refunded' : 'Approved'">
            {{ p.refundIssued ? 'Yes' : 'No' }}
          </span>
        </td>
      </tr>
    </tbody>
  </table>

  <ng-template #noResults>
    <div class="no-results">No transactions found</div>
  </ng-template>

  <!-- ---------------- Pagination ---------------- -->
  <div class="pager" *ngIf="totalPages > 1">
    <button (click)="prev()" [disabled]="currentPage === 1">« Prev</button>
    <button
      *ngFor="let p of pages"
      [class.active]="p === currentPage"
      (click)="setPage(p)"
    >
      {{ p }}
    </button>
    <button (click)="next()" [disabled]="currentPage === totalPages">Next »</button>
  </div>
</div>
